[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-writer"
version = "2.0.0"
description = "Multi-Agent Text Improvement Tool using OpenRouter AI models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MultiAgent-Writer Contributors"}
]
keywords = ["AI", "text-processing", "multi-agent", "PyQt6", "OpenRouter", "academic-writing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyQt6>=6.6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
multiagent-writer = "multiagent_writer.main:main"

[project.urls]
Repository = "https://github.com/yourusername/multiagent-writer"
Issues = "https://github.com/yourusername/multiagent-writer/issues"
Documentation = "https://github.com/yourusername/multiagent-writer#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multiagent_writer = ["*.json"]

# Ruff configuration (linting)
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "B", "C90"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports

# Black configuration (formatting)
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

# MyPy configuration (type checking)
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for strict typing
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/multiagent_writer --cov-report=html --cov-report=term"
